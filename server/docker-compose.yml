# تشغيل على خادم (VPS) مع HTTPS تلقائي عبر Caddy
# 1) وجّه نطاقك (A record) إلى IP الخادم   2) أنشئ ملف .env فيه DOMAIN و OWNER_USER و OWNER_PASS   3) docker compose up -d --build
services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - OWNER_USER=${OWNER_USER}
      - OWNER_PASS=${OWNER_PASS}
      - APP_SECRET=${APP_SECRET:-}
    volumes:
      - appdata:/data
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
volumes:
  appdata:
  caddydata:
