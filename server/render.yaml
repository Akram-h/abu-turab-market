services:
  - type: web
    name: alhamam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_USER
        sync: false
      - key: OWNER_PASS
        sync: false
      - key: DATABASE_URL
        sync: false
