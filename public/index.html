<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css">
<style>
header{background:var(--gd);color:#fff;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;gap:12px;padding:10px 0}
.top img{width:50px;height:50px}
.top h1{margin:0;font-size:19px;line-height:1.2}.top small{opacity:.8;font-size:12px}

#q{max-width:340px;background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#q::placeholder{color:rgba(255,255,255,.65)}
.cartb{position:relative;background:var(--y);color:#1a1300}
.cartb b{background:#fff;border-radius:99px;padding:0 7px;margin-inline-start:6px;font-size:13px}
.bar{background:var(--y);color:#1a1300;font-weight:600;font-size:14px;padding:6px 0;text-align:center}
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 0;scrollbar-width:thin}
.cat{flex:0 0 auto;width:92px;text-align:center;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:10px 4px;cursor:pointer;font-size:13px;font-weight:600;transition:border-color .15s}
.cat i{display:block;font-style:normal;font-size:30px;line-height:1.3}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.p{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.p .im{aspect-ratio:1/1;background:#eef2ec;display:grid;place-items:center;font-size:46px;position:relative}
.p img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;font-weight:800}
.p .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.p .n{font-weight:600;min-height:2.9em}.p .u{color:var(--mut);font-size:12px}
.p .pr{font-weight:800;font-size:17px;color:var(--g)}.old{color:var(--mut);text-decoration:line-through;font-size:13px;font-weight:400;margin-inline-start:6px}
.p .act{margin-top:8px}
.st{display:flex;align-items:center;justify-content:space-between;background:#e9f4ec;border-radius:12px;padding:3px}
.st button{width:36px;height:36px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:20px;cursor:pointer}
.dr{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}.dr.on{display:block}
.sh{position:absolute;inset-block:0;inset-inline-start:0;width:min(440px,100%);background:#fff;display:flex;flex-direction:column}
.sh .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:800;font-size:18px}
.sh .bd{flex:1;overflow:auto;padding:8px 16px}
.sh .ft{padding:14px 16px;border-top:1px solid var(--bd);background:#fafbf9}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.li .th{width:52px;height:52px;border-radius:10px;background:#eef2ec;overflow:hidden;display:grid;place-items:center;flex:none}
.li .th img{width:100%;height:100%;object-fit:cover}.li .f{flex:1;min-width:0;font-size:14px}
.tot{display:flex;justify-content:space-between;padding:2px 0}.tot.b{font-weight:800;font-size:19px;border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
.fm{display:grid;gap:8px;margin-top:10px}
.ok{text-align:center;padding:40px 16px}.ok div{font-size:56px}
#wl{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#1b6a3c,#0f3d22 70%);color:#fff;display:grid;place-items:center;text-align:center;padding:20px;transition:opacity .5s,visibility .5s}
#wl.off{opacity:0;visibility:hidden}
#wl img{width:130px;height:130px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#wl h1{font-size:clamp(28px,7vw,44px);margin:14px 0 4px}#wl p{margin:0 0 6px;opacity:.85}
#wl .ph{display:inline-block;margin:10px 0 22px;background:rgba(255,255,255,.12);border-radius:99px;padding:6px 18px;font-weight:600;direction:ltr}
#wl .bt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.wa{background:#25d366!important;color:#fff!important;text-decoration:none;display:inline-block}
.fab{position:fixed;bottom:18px;inset-inline-end:18px;z-index:9;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-decoration:none}
.so .im img{filter:grayscale(1);opacity:.45}.so .im::after{content:"نفذت الكمية";position:absolute;inset-inline:0;top:50%;transform:translateY(-50%);background:rgba(210,59,59,.92);color:#fff;text-align:center;font-weight:800;padding:4px}
.lowst{color:var(--red);font-size:12px;font-weight:600}
footer{margin-top:40px;background:var(--gd);color:#cfe0d3;text-align:center;padding:20px 10px;font-size:14px}
</style></head><body>
<div id="wl"><div><img src="/logo.svg" alt="شعار مركز أبو تراب"><h1>مركز أبو تراب للتسوق</h1><p>أهلاً بكم، كل ما يحتاجه بيتكم يصلكم لباب الدار</p><div class="ph">📞 07837700003</div>
<div class="bt"><button class="btn y" onclick="closeWl()">ابدأ التسوق 🛒</button><a class="btn wa" href="https://wa.me/9647837700003" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></div></div>
<header><div class="wrap"><div class="top">
<img src="/logo.svg" alt="شعار مركز أبو تراب"><div><h1>مركز أبو تراب للتسوق</h1><small>كل ما يحتاجه بيتك، يصلك لباب الدار</small></div><div class="sp"></div>
<input id="q" type="search" placeholder="ابحث عن منتج…" aria-label="بحث" oninput="draw()">
<button class="btn cartb" onclick="openCart()">🛒 السلة<b id="cc">0</b></button></div></div>
<div class="bar" id="bar"></div></header>
<main class="wrap"><div class="cats" id="cats"></div><div id="list"></div></main>
<footer>مركز أبو تراب للتسوق — <a href="tel:07837700003" style="color:var(--y);direction:ltr;display:inline-block">07837700003</a><br>© جميع الحقوق محفوظة</footer>
<a class="fab wa" href="https://wa.me/9647837700003?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1" target="_blank" rel="noopener" aria-label="واتساب">💬</a>
<div class="dr" id="dr" onclick="if(event.target===this)closeCart()"><div class="sh" id="sh"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("en-US")+" د.ع";
let D={settings:{},cats:[],products:[]},cat="الكل",cart={};
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const soldOut=p=>p.stock!=null&&p.stock<=0;
function closeWl(){$("wl").classList.add("off");try{sessionStorage.setItem("wl",1)}catch(e){}}
try{if(sessionStorage.getItem("wl"))$("wl").classList.add("off")}catch(e){}
const dp=p=>p*(1-(D.settings.disc||0)/100);
async function load(){try{D=await (await fetch("/api/store")).json()}catch(e){$("list").innerHTML='<div class="empty">تعذّر تحميل المتجر، حاول لاحقاً</div>';return}
  for(const id in cart){const p=D.products.find(p=>p.id===id&&p.on!==false);if(!p||soldOut(p))delete cart[id];else if(p.stock!=null&&cart[id]>p.stock)cart[id]=p.stock}saveCart();
  const s=D.settings;$("bar").innerHTML=(s.disc>0?`🔥 خصم ${s.disc}% على جميع المنتجات &nbsp;|&nbsp; `:"")+(s.free?"🚚 التوصيل مجاني":"🚚 التوصيل "+fmt(s.fee));draw()}
function draw(){
  const t=$("q").value.trim();
  $("cats").innerHTML=["الكل",...D.cats.map(c=>c.name)].map(n=>{const c=D.cats.find(x=>x.name===n);return `<button class="cat ${n===cat?"on":""}" data-c="${esc(n)}"><i>${c?esc(c.icon):"🏬"}</i>${esc(n)}</button>`}).join("");
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.c;$("q").value="";draw()});
  const ps=D.products.filter(p=>p.on!==false&&(cat==="الكل"||p.cat===cat)&&(!t||p.name.includes(t)));
  let h="";
  if(t||cat!=="الكل")h=ps.length?`<div class="grid" style="margin-top:14px">${ps.map(card).join("")}</div>`:`<div class="empty">لا توجد منتجات</div>`;
  else{const names=[...D.cats.map(c=>c.name),""];for(const n of names){const g=ps.filter(p=>(p.cat||"")===n||(n===""&&!D.cats.find(c=>c.name===p.cat)&&!(p.cat||"")));if(!g.length)continue;h+=`<h2>${esc(n||"منتجات أخرى")}</h2><div class="grid">${g.map(card).join("")}</div>`}
    if(!h)h='<div class="empty">سيتم إضافة المنتجات قريباً</div>'}
  $("list").innerHTML=h;
  $("cc").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}
function card(p){const q=cart[p.id]||0,d=D.settings.disc||0,c=D.cats.find(x=>x.name===p.cat);
  const so=soldOut(p);
  return `<div class="p ${so?"so":""}"><div class="im">${p.img?`<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}">`:(c?esc(c.icon):"🛒")}${d>0?`<span class="tag">-${d}%</span>`:""}</div>
  <div class="b"><div class="n">${esc(p.name)}</div><div class="u">${esc(p.unit)}</div>${!so&&p.stock!=null&&p.stock<=5?`<div class="lowst">متبقي ${p.stock} فقط</div>`:""}<div class="pr">${fmt(dp(p.price))}${d>0?`<span class="old">${fmt(p.price)}</span>`:""}</div>
  <div class="act">${so?`<button class="btn" style="width:100%;background:#9aa59d" disabled>نفذت الكمية</button>`:q?`<div class="st"><button aria-label="زيادة" onclick="chg('${p.id}',1)">+</button><b>${q}</b><button aria-label="نقصان" onclick="chg('${p.id}',-1)">−</button></div>`:`<button class="btn" style="width:100%" onclick="chg('${p.id}',1)">أضف للسلة</button>`}</div></div></div>`}
function chg(id,n){const p=D.products.find(x=>x.id===id);if(n>0&&p&&p.stock!=null&&(cart[id]||0)>=p.stock){alert("الكمية المتوفرة من هذا المنتج "+p.stock+" فقط");return}
  cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];saveCart();draw();if($("dr").classList.contains("on"))cartHtml()}
function totals(){let sub=0;for(const id in cart){const p=D.products.find(x=>x.id===id);if(p)sub+=p.price*cart[id]}const d=sub*(D.settings.disc||0)/100,fee=sub&&!D.settings.free?+D.settings.fee||0:0;return{sub,d,fee,t:sub-d+fee}}
function openCart(){$("dr").classList.add("on");cartHtml()}
function closeCart(){$("dr").classList.remove("on")}
function cartHtml(){
  const ids=Object.keys(cart).filter(id=>D.products.find(p=>p.id===id)),t=totals(),s=D.settings;
  const head=`<div class="hd"><span>🛒 سلة التسوق</span><button class="btn o sm" onclick="closeCart()">إغلاق</button></div>`;
  if(!ids.length){$("sh").innerHTML=head+`<div class="bd"><div class="empty">السلة فارغة<br>أضف منتجات لتبدأ</div></div>`;return}
  $("sh").innerHTML=head+`<div class="bd">${ids.map(id=>{const p=D.products.find(x=>x.id===id);return `<div class="li"><div class="th">${p.img?`<img src="${esc(p.img)}" alt="">`:"🛒"}</div><div class="f">${esc(p.name)}<br><b class="cur">${fmt(dp(p.price)*cart[id])}</b></div><div class="st" style="width:110px"><button onclick="chg('${id}',1)">+</button><b>${cart[id]}</b><button onclick="chg('${id}',-1)">−</button></div></div>`}).join("")}
  <div class="fm"><input id="cn" placeholder="الاسم الكامل" autocomplete="name"><input id="cp" type="tel" inputmode="tel" placeholder="رقم الهاتف" autocomplete="tel"><input id="ca" placeholder="العنوان (المنطقة، الشارع، أقرب نقطة دالة)" autocomplete="street-address"><textarea id="cx" rows="2" placeholder="ملاحظات (اختياري)"></textarea></div></div>
  <div class="ft"><div class="tot"><span>المجموع</span><span>${fmt(t.sub)}</span></div>${t.d?`<div class="tot"><span>الخصم (${s.disc}%)</span><span>-${fmt(t.d)}</span></div>`:""}<div class="tot"><span>التوصيل</span><span>${s.free?"مجاني":fmt(t.fee)}</span></div><div class="tot b"><span>الإجمالي</span><span>${fmt(t.t)}</span></div>
  ${s.minOrder&&t.sub<s.minOrder?`<div style="color:var(--red);font-size:13px">أقل مبلغ للطلب ${fmt(s.minOrder)}</div>`:""}<button class="btn y" style="width:100%;margin-top:10px" id="ob" onclick="order()">تأكيد الطلب — الدفع عند الاستلام</button></div>`}
async function order(){
  const b={name:$("cn").value,phone:$("cp").value,addr:$("ca").value,note:$("cx").value,items:Object.keys(cart).map(id=>({id,q:cart[id]}))};
  if(!b.name.trim()||!b.phone.trim()||!b.addr.trim())return alert("يرجى إدخال الاسم ورقم الهاتف والعنوان");
  $("ob").disabled=true;
  try{const r=await fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await r.json();
    if(!r.ok)throw new Error(j.error||"");
    cart={};saveCart();draw();$("sh").innerHTML=`<div class="hd"><span>تم الطلب</span><button class="btn o sm" onclick="closeCart()">إغلاق</button></div><div class="ok"><div>✅</div><h3>تم استلام طلبك رقم ${j.no}</h3><p>سنتصل بك على ${esc(b.phone)} لتأكيد التوصيل.</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/9647837700003?text=${encodeURIComponent('مرحباً، أنا '+b.name+'، بخصوص طلبي رقم '+j.no)}">راسلنا عبر واتساب</a></div>`;
  }catch(e){alert(e.message||"تعذّر إرسال الطلب، حاول مرة أخرى");$("ob").disabled=false}}
load();
</script></body></html>
