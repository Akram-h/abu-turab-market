name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Prepare web app for Android
        working-directory: mobile
        run: node scripts/prepare.js https://alhamam-server.onrender.com

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Generate Android app icons and splash assets
        working-directory: mobile
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alhamam-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
